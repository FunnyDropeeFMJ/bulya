name: Windows alpha checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app_frames
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app_frames/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run test:native
      - run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Bulya-windows-x64-alpha
          path: app_frames/dist/Bulya-*-windows-x64.exe
          if-no-files-found: error
